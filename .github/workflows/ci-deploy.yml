name: CI and Deploy to Render

on:
  push:
    branches:
      - feat/monitoring
      - develop
  pull_request:
    branches:
      - develop

jobs:
  ci-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: apps/backend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd apps/backend
          pnpm install --no-frozen-lockfile

      - name: Audit Dependencies
        continue-on-error: true
        run: |
          cd apps/backend
          pnpm audit --audit-level=high

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v1

      - name: Install Snyk CLI
        run: pnpm install -g snyk

      - name: Snyk Security Scan
        continue-on-error: true
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          cd apps/backend
          doppler run --project example-project --config prd_rwby -- snyk test --severity-threshold=high

      - name: Lint Backend
        run: |
          cd apps/backend
          pnpm lint

  deploy:
    needs: ci-backend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/devops-workflow' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v1

      - name: Trigger Render Deploy Hook
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          DEPLOY_HOOK=$(doppler secrets get RENDER_DEPLOY_HOOK_URL --project rwby --config prd_rwby --plain)
          curl -sS "$DEPLOY_HOOK"
