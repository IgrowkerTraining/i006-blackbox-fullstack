name: CI and Deploy to Render

on:
  push:
    branches: [develop]
    paths: ["apps/backend/**", ".github/workflows/ci-deploy.yml"]
  pull_request:
    branches: [develop]
    paths: ["apps/backend/**"]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: apps/backend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd apps/backend
          pnpm install --frozen-lockfile

      - name: Audit Dependencies
        continue-on-error: true
        run: |
          cd apps/backend
          pnpm audit --audit-level=high

      - name: Lint Backend
        run: |
          cd apps/backend
          pnpm lint

      - name: Generate Prisma Client
        run: |
          cd apps/backend
          pnpm prisma generate

      - name: Run Tests
        continue-on-error: true
        run: |
          cd apps/backend
          pnpm test -- --passWithNoTests

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: 'apps/backend'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check Trivy Report exists
        id: check_trivy
        run: |
          if [ -f trivy-results.sarif ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: steps.check_trivy.outputs.exists == 'true'
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    needs: ci-backend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v1

      - name: Trigger Render Deploy Hook
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          DEPLOY_HOOK=$(doppler secrets get RENDER_DEPLOY_HOOK_URL --project example-project --config prd_rwby --plain)
          curl -sS "$DEPLOY_HOOK"