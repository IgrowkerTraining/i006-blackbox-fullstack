services:
  backend:
    build:
      context: ./apps/backend
      target: development
    command: sh -c "pnpm install --config.store-dir=/app/node_modules/.pnpm-store --node-linker=hoisted && pnpm prisma generate && pnpm prisma migrate deploy && pnpm prisma db seed && pnpm run dev"
    ports:
      - "3000:3000"
    env_file:
      - ./apps/backend/.env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CI=true
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-blackbox_db}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  frontend:
    build:
      context: ./apps/frontend
      target: development
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api
      - CI=true
    command: sh -c "pnpm install --config.store-dir=/app/node_modules/.pnpm-store --node-linker=hoisted && pnpm run dev"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-blackbox_db}
    ports:
      - 5434:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Production services (uncomment for production)
  # backend-prod:
  #   build:
  #     context: ./apps/backend
  #     target: production
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NODE_ENV=production
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s

networks:
  default:
    name: example-auth-network

volumes:
  postgres_data:
